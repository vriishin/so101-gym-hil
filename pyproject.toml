[project.urls]
homepage = "https://github.com/vriishin/so101-gym-hil"
repository = "https://github.com/vriishin/so101-gym-hil"
issues = "https://github.com/vriishin/so101-gym-hil/issues"

[project]
name = "so101-gym-hil"
version = "0.1.0"
description = "SO-101 pick-and-place in MuJoCo with HIL controls and instrumented learning pipelines"
authors = [
  {name = "vriishin", email = "95161161+vriishin@users.noreply.github.com"}
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "mujoco>=2.3.7,<3.9.0",
    "gymnasium>=0.29.1,<2.0.0",
    "numpy>=1.26,<3.0",
    "pygame>=2.5.1",
    "pynput>=1.7.7",
    "hidapi>=0.14.0",
    "imageio[ffmpeg]>=2.34.0",
]

[project.optional-dependencies]
dev = ["pre-commit>=3.7.0", "debugpy>=1.8.1"]
test = ["pytest>=8.1.0", "pytest-cov>=5.0.0"]
state-rl = ["stable-baselines3>=2.6,<3", "pyyaml>=6,<7"]
visual-rl = ["torch>=2.2,<3", "pyyaml>=6,<7"]

[tool.poetry]
requires-poetry = ">=2.1"
packages = [{include = "gym_hil"}]
include = ["gym_hil/controller_config.json"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [
    "example.py",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "B", "C4", "SIM"]
ignore-init-module-imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
